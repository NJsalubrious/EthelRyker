    const [selected, setSelected] = React.useState(null);
    const host = React.useRef(null);
    const player = React.useRef(null);
    const external = React.useRef(false);
    const [message, setMessage] = React.useState('');
    React.useEffect(() => {
        if (!selected) {
            if (!external.current) window.resumeEthelBackgroundAudio();
            return;
        }
        let disposed = false;
        const started = Date.now();
        const connect = () => {
            if (disposed) return;
            if (!window.YT?.Player) {
                if (Date.now() - started > 12000) {
                    setMessage('The player could not load. Try the YouTube link below.');
                    window.resumeEthelBackgroundAudio();
                    return;
                }
                timer = setTimeout(connect, 150);
                return;
            }
            const mount = document.createElement('div');
            host.current.appendChild(mount);
            player.current = new YT.Player(mount, {
                host: 'https://www.youtube-nocookie.com',
                videoId: selected.videoId,
                playerVars: { autoplay: 1, playsinline: 1, rel: 0, origin: window.location.origin },
                events: {
                    onReady: (event) => { if (!disposed) { event.target.getIframe().title = selected.title + ' player'; event.target.playVideo(); } },
                    onStateChange: (event) => {
                        if (disposed) return;
                        if (event.data === 1 || event.data === 3) window.stopEthelBackgroundAudio();
                        else if (event.data === 2 || event.data === 0) window.resumeEthelBackgroundAudio();
                    },
                    onAutoplayBlocked: () => { if (!disposed) window.resumeEthelBackgroundAudio(); },
                    onError: () => {
                        if (disposed) return;
                        setMessage('This song could not play here. Try the YouTube link below.');
                        window.resumeEthelBackgroundAudio();
                    }
                }
            });
        };
        let timer;
        connect();
        return () => {
            disposed = true;
            clearTimeout(timer);
            if (player.current) { player.current.destroy(); player.current = null; }
        };
    }, [selected]);
    React.useEffect(() => () => window.resumeEthelBackgroundAudio(), []);
    const play = (track) => {
        external.current = false;
        setMessage('');
        window.stopEthelBackgroundAudio();
        if (selected?.id === track.id && player.current) { player.current.playVideo(); return; }
        setSelected(track);
    };
    return (
        <section className="ethel-songs">

    <!-- BACKGROUND AUDIO (Privacy-Enhanced) -->
    <style>
        #background-music-toggle{position:fixed;right:max(16px,env(safe-area-inset-right));top:max(6px,env(safe-area-inset-top));z-index:10020;display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:1px solid #ffffff26;border-radius:50%;background:#131310;color:#d2a078;opacity:.65;font:16px/1 monospace;cursor:pointer;touch-action:manipulation;transition:opacity .2s,border-color .2s}
        #background-music-toggle:hover,#background-music-toggle:focus-visible{opacity:1;border-color:#d2a078}
        #background-music-toggle:focus-visible{outline:2px solid #e4bc7e;outline-offset:4px}
        #background-music-toggle .music-symbol{font-size:16px;display:block}
        #background-music-toggle .music-label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
        .ethel-header{padding-right:max(80px,calc(env(safe-area-inset-right) + 64px))!important}
        @media(prefers-reduced-motion:reduce){#background-music-toggle{transition:none}}
    </style>
    <button id="background-music-toggle" type="button" aria-label="Play background music"><span class="music-symbol" aria-hidden="true">▶</span><span class="music-label">Play music</span></button>
    <script src="https://www.youtube.com/iframe_api"></script>
    <div id="yt-bg-player"
        style="position:fixed;bottom:0;right:0;width:1px;height:1px;opacity:0.01;pointer-events:none;z-index:-1;"></div>

    <script>
        // Desktop = YouTube (privacy-enhanced, for view counts), Mobile = direct MP3
        // Fallback: if YouTube fails or is blocked by privacy settings, MP3 kicks in
        const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1);
        const FALLBACK_MP3 = 'https://pub-111e813bd5634cd8a9ecdd3d5c2a0916.r2.dev/PixelStortionSongs/11.NormalEthelV1.mp3';
        let audioStarted = false;
        let backgroundAudioSuppressed = false;
        let backgroundAudioManuallyPaused = false;
        const musicToggle = document.getElementById('background-music-toggle');
        function updateMusicControl() {
            const enabled = audioStarted && !backgroundAudioManuallyPaused;
            musicToggle.querySelector('.music-symbol').textContent = enabled ? 'Ⅱ' : '▶';
            musicToggle.querySelector('.music-label').textContent = enabled ? (backgroundAudioSuppressed ? 'Music: auto-resume' : 'Pause music') : 'Play music';
            musicToggle.setAttribute('aria-label', enabled ? 'Pause background music' : 'Play background music');
            musicToggle.title = backgroundAudioSuppressed && enabled ? 'Paused for the selected song. Click to keep background music paused.' : musicToggle.getAttribute('aria-label');
        }
        musicToggle.addEventListener('click', function (event) {
            event.stopPropagation();
            if (audioStarted && !backgroundAudioManuallyPaused) {
                backgroundAudioManuallyPaused = true;
                if (mp3Fallback) mp3Fallback.pause();
                if (bgPlayer && bgPlayer.pauseVideo) { try { bgPlayer.pauseVideo(); } catch (e) {} }
            } else {
                backgroundAudioManuallyPaused = false;
                if (!backgroundAudioSuppressed) {
                    if (mp3Fallback) {
                        audioStarted = true;
                        mp3Fallback.play().catch(function () { audioStarted = false; updateMusicControl(); });
                    } else {
                        audioStarted = false;
                        startBackgroundAudio();
                    }
                }
            }
            updateMusicControl();
        });
        document.addEventListener('fullscreenchange', function () {
            (document.fullscreenElement || document.body).appendChild(musicToggle);
        });
        window.stopEthelBackgroundAudio = function () {
            backgroundAudioSuppressed = true;
            audioStarted = true;
            ['click', 'touchend', 'keydown'].forEach(function (evt) {
                document.removeEventListener(evt, startBackgroundAudio);
            });
            if (mp3Fallback) mp3Fallback.pause();
            if (bgPlayer && bgPlayer.pauseVideo) { try { bgPlayer.pauseVideo(); } catch (e) {} }
            updateMusicControl();
        };
        window.resumeEthelBackgroundAudio = function () {
            if (!backgroundAudioSuppressed) return;
            backgroundAudioSuppressed = false;
            updateMusicControl();
            if (backgroundAudioManuallyPaused) return;
            if (mp3Fallback) {
                mp3Fallback.play().catch(function () {});
            } else {
                audioStarted = false;
                startBackgroundAudio();
            }
        };
        let mp3Fallback = null;

        // --- DESKTOP: YouTube (privacy-enhanced mode) ---
        let bgPlayer = null;
        let playerReady = false;
        let ytPlaying = false;

        function onYouTubeIframeAPIReady() {
            if (isMobile) return;
            try {
                bgPlayer = new YT.Player('yt-bg-player', {
                    host: 'https://www.youtube-nocookie.com',
                    videoId: 'OxHZnnRhtbk',
                    playerVars: {
                        autoplay: 0, loop: 1, playlist: 'OxHZnnRhtbk',
                        controls: 0, showinfo: 0, modestbranding: 1,
                        playsinline: 1, rel: 0, origin: window.location.origin
                    },
                    events: {
                        'onReady': function (event) {
                            event.target.setVolume(30);
                            playerReady = true;
                        },
                        'onStateChange': function (event) {
                            ytPlaying = event.data === YT.PlayerState.PLAYING;
                            if (event.data === YT.PlayerState.PLAYING) {
                                if (backgroundAudioSuppressed || backgroundAudioManuallyPaused || mp3Fallback) { event.target.pauseVideo(); return; }
                                ytPlaying = true;
                            }
                        },
                        'onError': function () {
                            // YouTube blocked or errored — use MP3 fallback
                            playMP3Fallback();
                        }
                    }
                });
            } catch (e) {
                // YouTube API failed entirely
                playerReady = false;
            }
        }

        function playMP3Fallback() {
            if (backgroundAudioSuppressed || backgroundAudioManuallyPaused || !audioStarted) return;
            if (mp3Fallback) return; // Already playing
            if (bgPlayer && bgPlayer.pauseVideo) { try { bgPlayer.pauseVideo(); } catch (e) {} }
            mp3Fallback = new Audio(FALLBACK_MP3);
            mp3Fallback.volume = 0.3;
            mp3Fallback.loop = true;
            mp3Fallback.play().catch(function () { audioStarted = false; updateMusicControl(); });
        }

        function startBackgroundAudio(event) {
            if (event && event.target.closest && event.target.closest('#background-music-toggle')) return;
            if (backgroundAudioSuppressed || backgroundAudioManuallyPaused) return;
            if (audioStarted) return;
            audioStarted = true;
            updateMusicControl();
            ['click', 'touchend', 'keydown'].forEach(function (evt) {
                document.removeEventListener(evt, startBackgroundAudio);
            });

            if (isMobile) {
                playMP3Fallback();
            } else {
                // Try YouTube first
                if (playerReady && bgPlayer && bgPlayer.playVideo) {
                    try { bgPlayer.playVideo(); } catch (e) { }
                    // If YouTube doesn't start playing within 4 seconds, fall back to MP3
                    setTimeout(function () {
                        if (!ytPlaying) {
                            playMP3Fallback();
                        }
                    }, 4000);
                } else {
                    // YouTube never initialized — go straight to MP3
                    playMP3Fallback();
                }
            }
        }

        ['click', 'touchend', 'keydown'].forEach(function (evt) {
            document.addEventListener(evt, startBackgroundAudio);
        });
    </script>
    <!-- Branding Glitch Script & Dropdown Toggle -->
    <script>
        class BrandingGlitch {
            constructor(el) {
                this.el = el;
                this.chars = '!<>-_\\\\/[]{}-=+*^?#_01';
                this.update = this.update.bind(this);
            }
            setText(newText) {
                const oldText = this.el.innerText;
                const length = Math.max(oldText.length, newText.length);
                const promise = new Promise((resolve) => this.resolve = resolve);
                this.queue = [];
                for (let i = 0; i < length; i++) {
                    const from = oldText[i] || '';
                    const to = newText[i] || '';
                    const start = Math.floor(Math.random() * 15);
                    const end = start + Math.floor(Math.random() * 15);
                    this.queue.push({ from, to, start, end });
                }
                cancelAnimationFrame(this.frameRequest);
                this.frame = 0;
                this.update();
                return promise;
            }
            update() {
                let output = '';
                let complete = 0;
                for (let i = 0, n = this.queue.length; i < n; i++) {
                    let { from, to, start, end, char } = this.queue[i];
                    if (this.frame >= end) {
                        complete++;
                        output += to;
                    } else if (this.frame >= start) {
                        if (!char || Math.random() < 0.28) {
                            char = this.randomChar();
                            this.queue[i].char = char;
                        }
                        output += char;
                    } else {
                        output += from;
                    }
                }
                this.el.innerText = output;
                this.el.setAttribute('data-text', output); // Update CSS glitch pseudo-element
                if (complete === this.queue.length) {
                    this.resolve();
                } else {
                    this.frameRequest = requestAnimationFrame(this.update);
                    this.frame++;
                }
            }
            randomChar() {
                return this.chars[Math.floor(Math.random() * this.chars.length)];
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Need a slight delay for React to mount the DOM element
            setTimeout(() => {
                const brandEl = document.querySelector('.ps-brand');
                if (brandEl) {
                    const brandFx = new BrandingGlitch(brandEl);
                    const brandWords = [
                        'PIXELSTORTION', 'PROJECTS', 'BIO', 'SILENCE', 'MATAALA', 
                        'CINEMA', 'MUSIC', 'VEX', 'SOCIAL NETWORK', 'PIXELSTORTION', 
                        'NALANI', 'REDFERN', 'TURNBULL', 'PIXELSTORTION', 
                        'ETHEL', 'ISLA', 'DOMINIC', 'STICKY', 'KINLEY', 'PIXELSTORTION'
                    ];
                    let wordIndex = 0;

                    function nextBrandWord() {
                        wordIndex = (wordIndex + 1) % brandWords.length;
                        brandFx.setText(brandWords[wordIndex]).then(() => {
                            let delay = 1500; // Hold on secondary words
                            if (brandWords[wordIndex] === 'PIXELSTORTION') {
                                delay = 6000; // Hold longer on the main brand
                            }
                            setTimeout(nextBrandWord, delay);
                        });
                    }

                    setTimeout(nextBrandWord, 6000); // Start cycle after 6 seconds
                }

                // Highlight Active Link (Universal Matcher)
                const currentUrl = window.location.href.toLowerCase();
                const dropdownLinks = document.querySelectorAll('.brand-dropdown-item');

                dropdownLinks.forEach(link => {
                    let href = link.getAttribute('href');
                    if (!href) return;
                    href = href.toLowerCase();
                    
                    let isMatch = false;
                    if (href.includes('vex_social_network') && currentUrl.includes('vex_social_network')) isMatch = true;
                    else if (href.includes('ethelryker.com') && currentUrl.includes('ethelryker')) isMatch = true;
                    else if (href.includes('dominicryker.com') && currentUrl.includes('dominicryker')) isMatch = true;
                    else if (href.includes('isla_album') && currentUrl.includes('isla_album')) isMatch = true;
                    else if (href === 'https://islaband.com' && currentUrl.includes('islaband') && !currentUrl.includes('isla_album')) isMatch = true;
                    else if (href.includes('zones/silence') && currentUrl.includes('silence') && !currentUrl.includes('silenceisthetrauma')) isMatch = true;
                    else if (href === 'https://silenceisthetrauma.com' && currentUrl.includes('silenceisthetrauma') && !currentUrl.includes('vex_social_network')) isMatch = true;
                    else if (href.includes('zones/mataala') && currentUrl.includes('mataala')) isMatch = true;
                    else if (href.includes('ethel_gallery') && currentUrl.includes('ethel_gallery')) isMatch = true;
                    else if (href.includes('silentcinema') && currentUrl.includes('silentcinema')) isMatch = true;
                    else if (href.includes('bio') && currentUrl.includes('bio')) isMatch = true;

                    if (isMatch) {
                        link.removeAttribute('href');
                        link.style.opacity = '0.4';
                        link.style.cursor = 'default';
                        link.style.pointerEvents = 'none';
                        link.innerHTML += ' <span style="font-size:9px; letter-spacing:1px; margin-left:8px; color:#666;">[ACTIVE]</span>';
                    }
                });
            }, 500);
        });

        // Dropdown Toggle Logic
        window.toggleBrandMenu = function(e) {
            e.stopPropagation();
            const menu = document.getElementById('brandDropdown');
            if (menu) menu.classList.toggle('active');
        };

        document.addEventListener('click', (e) => {
            const menu = document.getElementById('brandDropdown');
            if (menu && menu.classList.contains('active')) {
                menu.classList.remove('active');
            }
        });
    </script>
